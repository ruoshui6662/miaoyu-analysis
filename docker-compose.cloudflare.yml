services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      # 令牌通过环境变量注入，不写入 command，避免出现在进程列表中。
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?请在 .env 设置 CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      yuqing:
        condition: service_healthy
    restart: unless-stopped
