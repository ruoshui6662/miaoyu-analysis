services:
  web:
    image: ghcr.io/ruoshui6662/miaoyu-analysis:latest
    container_name: miaoyu
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:5000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - "${TRIM_PKGVAR}/data:/app/data"
      - "${TRIM_PKGETC}/.env:/app/.env:ro"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
